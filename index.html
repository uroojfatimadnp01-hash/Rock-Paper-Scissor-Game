<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="heading">
        <h1>Rock Paper Scissor   </h1>
    </div>

    <div class="conatiner">
        <div class="choices">
            <div class="choice" id="rock">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSGnQSVMwyEcNaXkt-ENNPClVnqDFA2paBQSb949Xy9dA&s=10"/>
            </div>
            <div class="choice" id="paper">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_qrNbTHvGdXSnVqkv_oO045CaZeqKE_gz_AQVXW0g2A&s=10"/>
                        </div>
            <div class="choice" id="scissor">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTgcdX8i7zfL-C6Hd_by8Ufyh_0ReupoA5YCuZCSjoJ4w&s=10"/>
            </div>
        </div>
    </div>


    <div class="score-board">
        <div class="user">
            <p class="user-score">0</p>
            <p>You</p>
        </div>
        <div class="computer">
            <p class="comp-score">0</p>
            <p>Computer</p>
        </div>
    </div>
    <div class="msg-container">
       <p class="msg">Pick your move</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
